<!DOCTYPE html>
<html lang=""en">
<head>
    <meta charset=""UTF-8">
    <meta name=""viewport" content=""width=device-width, initial-scale="1.0">
    <title>My Health — Run Your Clinic Without the Chaos</title><title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
          *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            :root {
                    --teal: #1D9E75;
                        --teal-dark: #0F6E56;
                            --teal-light: #E1F5EE;
                                --teal-mid: #9FE1CB;
                                    --ink: #0E1117;
                                        --ink-soft: #3A3D45;
                                            --muted: #6B7280;
                                                --border: #E5E7EB;
                                                    --surface: #F9FAFB;
                                                        --white: #FFFFFF;
                                                            --danger: #E24B4A;
                                                                --amber: #EF9F27;
            }
               html { scroll-behavior: smooth; }
                 body {
                        font-family: 'DM Sans', sans-serif;
                            color: var(--ink);
                                background: var(--white);
                                    line-height: 1.7;
                                        font-size: 16px;
                                            overflow-x: hidden;
                 }
                  h1, h2, h3, h4 {
                      font-family: 'Sora', sans-serif;
                        line-height: 1.2;
                  }
                     nav{
                            position: sticky ; top: 0; z-index: 100;
                                background: rgba(255,255,255,0.95);
                                    backdrop-filter: blur(12px);
                                        border-bottom: 1px solid var(--border);
                                            padding: 0 5%;
                                                display: flex; align-items: center; justify-content: space-between;
                                                    height: 64px;
                     }
                         .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
                           .nav-logo-icon {
                                width: 36px; height: 36px; border-radius: 10px;
                                    background: var(--teal);
                                        display: flex; align-items: center; justify-content: center;
                           }
                             .nav-logo-icon svg { width: 20px; height: 20px; fill: white; }
                               .nav-brand { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); }
                                 .nav-brand span { color: var(--teal); }
                                   .nav-cta {
                                        background: var(--teal); color: white;
                                            padding: 10px 22px; border-radius: 8px;
                                                font-family: 'Sora', sans-serif; font-weight: 600; font-size: 14px;
                                                    text-decoration: none; transition: background 0.2s;
                                                        white-space: nowrap;
                                   }
                                       .nav-cta:hover { background: var(--teal-dark); }

                                         /* HERO */
                                           .hero {
                                                padding: 80px 5% 60px;
                                                    max-width: 1100px; margin: 0 auto;
                                                        display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
                                           }
                                             .hero-badge {
                                                    display: inline-flex; align-items: center; gap: 8px;
                                                        background: var(--teal-light); color: var(--teal-dark);
                                                            padding: 6px 14px; border-radius: 100px;
                                                                font-size: 13px; font-weight: 500; margin-bottom: 24px;
                                             }
                                               .hero-badge span { width: 7px; height: 7px; background: var(--teal); border-radius: 50%; animation: pulse 2s infinite; }
                                                 @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
                                                   .hero h1 { font-size: clamp(32px, 4vw, 52px); font-weight: 700; color: var(--ink); margin-bottom: 20px; }
                                                     .hero h1 em { font-style: normal; color: var(--teal); }
                                                       .hero-sub { font-size: 18px; color: var(--ink-soft); margin-bottom: 32px; line-height: 1.65; }
                                                         .hero-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
                                                           .btn-primary {
                                                                background: var(--teal); color: white;
                                                                    padding: 16px 32px; border-radius: 10px;
                                                                        font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px;
                                                                            text-decoration: none; transition: all 0.2s; display: inline-block;
                                                           }
                                                             .btn-primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
                                                               .btn-ghost {
                                                                    color: var(--teal); font-weight: 600; font-size: 15px;
                                                                        text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
                                                               }
                                                                 .hero-trust { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 16px; }
                                                                   .trust-pill {
                                                                        font-size: 13px; color: var(--muted);
                                                                            display: flex; align-items: center; gap: 6px;
                                                                   }
                                                                     .trust-pill svg { width: 14px; height: 14px; }

                                                                       /* DASHBOARD MOCKUP */
                                                                         .dashboard-wrap {
                                                                                background: #F3F4F6; border-radius: 16px; padding: 12px;
                                                                                    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
                                                                                        position: relative;
                                                                         }
                                                                           .dashboard-bar {
                                                                                background: white; border-radius: 10px 10px 0 0;
                                                                                    padding: 10px 14px; display: flex; align-items: center; gap: 8px;
                                                                                        border-bottom: 1px solid var(--border);
                                                                           }
                                                                             .dot { width: 10px; height: 10px; border-radius: 50%; }
                                                                               .dot-red { background: #FF5F56; }
                                                                                 .dot-yellow { background: #FFBD2E; }
                                                                                   .dot-green { background: #27C93F; }
                                                                                     .dash-url { margin-left: 8px; background: var(--surface); border-radius: 6px; padding: 4px 12px; font-size: 11px; color: var(--muted); flex: 1; max- flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
                                                                                       .dash-greeting { font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; }
                                                                                         .dash-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
                                                                                           .dash-status { background: var(--teal-light); color: var(--teal-dark); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 100px; }
                                                                                             .dash-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
                                                                                               .dash-stat { background: var(--surface); border-radius: 8px; padding: 10px 8px; text-align: center; }
                                                                                                 .dash-stat-num { font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 700; color: var(--ink); }
                                                                                                   .dash-stat-label { font-size: 9px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.4px; }
                                                                                                     .dash-queue-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
                                                                                                       .dash-patient { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid var(--border); }
                                                                                                         .dash-patient.active { border-color: var(--teal); background: var(--teal-light); }
                                                                                                           .token-badge { width: 28px; height: 28px; border-radius: 6px; background: var(--ink); color: white; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; flex-shrink: 0; }
                                                                                                             .token-badge.teal { background: var(--teal); }
                                                                                                               .patient-info { flex: 1; }
                                                                                                                 .patient-name { font-size: 12px; font-weight: 600; color: var(--ink); }
                                                                                                                   .patient-type { font-size: 10px; color: var(--muted); }
                                                                                                                     .patient-tag { font-size: 9px; font-weight: 600; padding: 3px 8px; border-radius: 100px; white-space: nowrap; }
                                                                                                                       .tag-waiting { background: #FEF3C7; color: #92400E; }
                                                                                                                         .tag-next { background: var(--teal-light); color: var(--teal-dark); }
                                                                                                                           .tag-online { background: #EDE9FE; color: #5B21B6; }
                                                                                                                             /* SOCIAL PROOF BAR */.btn-ghost  .proof-bar {
                                                                                                                                  background: var(--ink); color: white;
                                                                                                                                      padding: 20px 5%; text-align: center;
                                                                                                                             }
                                                                                                                               .proof-bar-inner { max-width: 900px; margin: 0 auto; display: flex; justify-content: center; gap: 48px; flex-wrap: wrap; }
                                                                                                                                 .proof-num { font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; color: var(--teal-mid); }
                                                                                                                                   .proof-label { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px; }

                                                                                                                                     /* SECTION COMMON */
                                                                                                                                       section { padding: 80px 5%; }
                                                                                                                                         .section-inner { max-width: 1100px; margin: 0 auto; }
                                                                                                                                           .section-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); margin-bottom: 12px; }
                                                                                                                                             .section-title { font-size: clamp(26px, 3vw, 40px); font-weight: 700; color: var(--ink); margin-bottom: 16px; }
                                                                                                                                               .section-sub { font-size: 17px; color: var(--muted); max-width: 600px; }

                                                                                                                                                 /* PAIN SECTION */
                                                                                                                                                   .pain-section { background: #FFF8F5; }
                                                                                                                                                     .pain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 48px; }
                                                                                                                                                       .pain-card {
                                                                                                                                                            background: white; border: 1px solid #FDDCC9;
                                                                                                                                                                border-radius: 12px; padding: 24px;
                                                                                                                                                       }
                                                                                                                                                         .pain-icon { font-size: 28px; margin-bottom: 14px; }
                                                                                                                                                           .pain-title { font-family: 'Sora', sans-serif; font-weight: 600; font-size: 16px; margin-bottom: 8px; }
                                                                                                                                                             .pain-desc { font-size: 14px; color: var(--muted); line-height: 1.65; }
                                                                                                                                                               .pain-quote {
                                                                                                                                                                    background: var(--ink); color: white;
                                                                                                                                                                        border-radius: 12px; padding: 28px 32px;
                                                                                                                                                                            margin-top: 36px;
                                                                                                                                                                                display: flex; gap: 20px; align-items: flex-start;
                                                                                                                                                               }
                                                                                                                                                                 .pain-quote-mark { font-family: 'Sora', sans-serif; font-size: 60px; color: var(--teal); line-height: 1; flex-shrink: 0; margin-top: -10px; }
                                                                                                                                                                   .pain-quote-text { font-size: 17px; font-style: italic; color: rgba(255,255,255,0.9); margin-bottom: 12px; }
                                                                                                                                                                     .pain-quote-attr { font-size: 13px; color: rgba(255,255,255,0.5); }

                                                                                                                                                                       /* VS SECTION */
                                                                                                                                                                         .vs-section { background: white; }
                                                                                                                                                                           .vs-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; margin-top: 48px; align-items: stretch; }
                                                                                                                                                                             .vs-card { border-radius: 16px; padding: 32px; }
                                                                                                                                                                               .vs-card.bad { background: #FFF1F1; border: 1px solid #FECACA; }
                                                                                                                                                                                 .vs-card.good { background: var(--teal-light); border: 2px solid var(--teal); }
                                                                                                                                                                                   .vs-card-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 20px; }
                                                                                                                                                                                     .vs-card.bad .vs-card-title { color: var(--danger); }
                                                                                                                                                                                       .vs-card.good .vs-card-title { color: var(--teal-dark); }
                                                                                                                                                                                         .vs-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; font-size: 15px; }
                                                                                                                                                                                           .vs-icon { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; margin-top: 3px; }
                                                                                                                                                                                             .vs-item.bad .vs-icon { background: #FCA5A5; color: #B91C1C; }
                                                                                                                                                                                               .vs-item.good .vs-icon { background: var(--teal); color: white; }
                                                                                                                                                                                                 .vs-divider { display: flex; align-items: center; justify-content: center; padding: 0 20px; }
                                                                                                                                                                                                   .vs-badge { background: var(--ink); color: white; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 14px; padding: 12px 16px; border-radius: 50%; }

                                                                                                                                                                                                     /* FEATURES */
                                                                                                                                                                                                       .features-section { background: var(--surface); }
                                                                                                                                                                                                         .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 48px; }
                                                                                                                                                                                                           .feature-card {
                                                                                                                                                                                                                background: white; border: 1px solid var(--border); border-radius: 14px; padding: 28px;
                                                                                                                                                                                                                    transition: box-shadow 0.2s, transform 0.2s;
                                                                                                                                                                                                                      }
                                                                                                                                                                                                                        .feature-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.07); transform: translateY(-2px); }
                                                                                                                                                                                                                          .feature-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--teal-light); display: flex; align-items: center; justify-content: center; margin-bottom: 18px; }
                                                                                                                                                                                                                            .feature-icon svg { width: 24px; height: 24px; stroke: var(--teal-dark); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
                                                                                                                                                                                                                              .feature-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 17px; margin-bottom: 10px; }
                                                                                                                                                                                                                                .feature-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }

                                                                                                                                                                                                                                  /* HOW IT WORKS */
                                                                                                                                                                                                                                    .hiw-section { background: white; }
                                                                                                                                                                                                                                      .steps { margin-top: 56px; position: relative; }
                                                                                                                                                                                                                                        .steps::before {
                                                                                                                                                                                                                                              content: '';
                                                                                                                                                                                                                                                  position: absolute;
                                                                                                                                                                                                                                                      left: 28px; top: 0; bottom: 0;
                                                                                                                                                                                                                                                          width: 2px; background: linear-gradient(to bottom, var(--teal-mid), var(--teal-light));
                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                          .step { display: flex; gap: 28px; margin-bottom: 44px; position: relative; }
                                                                                                                                                                                                                                            .step-num {
                                                                                                                                                                                                                                                  width: 56px; height: 56px; border-radius: 50%;
                                                                                                                                                                                                                                                      background: var(--teal); color: white;
                                                                                                                                                                                                                                                          font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px;
                                                                                                                                                                                                                                                              display: flex; align-items: center; justify-content: center;
                                                                                                                                                                                                                                                                  flex-shrink: 0; position: relative; z-index: 1;
                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                              .step-body { padding-top: 12px; }
                                                                                                                                                                                                                                                .step-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 8px; }
                                                                                                                                                                                                                                                  .step-desc { font-size: 15px; color: var(--muted); }
                                                                                                                                                                                                                                                    .step-note { display: inline-block; margin-top: 8px; background: var(--teal-light); color: var(--teal-dark); font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 100px; }

                                                                                                                                                                                                                                                      /* OUTCOMES */
                                                                                                                                                                                                                                                        .outcomes-section { background: var(--ink); color: white; }
                                                                                                                                                                                                                                                          .outcomes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-top: 48px; }
                                                                                                                                                                                                                                                            .outcome-card { backgrounserif; font-size: 40px; font-weight: 700; color: var(--teal-mid); margin-bottom: 8px; }
                                                                                                                                                                                                                                                              .outcome-label { font-size: 15px; color: rgba(255,255,255,0.65); }
                                                                                                                                                                                                                                                              
                                                                                                                                                                                                                                                                /* PRICING */.btn-ghost  .pricing-section { background: var(--surface); }
                                                                                                                                                                                                                                                                  .pricing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 48px; max-width: 800px; }
                                                                                                                                                                                                                                                                    .pricing-card { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 32px; }
                                                                                                                                                                                                                                                                      .pricing-card.featured { border: 2px solid var(--teal); position: relative; }
                                                                                                                                                                                                                                                                        .pricing-badge {
                                                                                                                                                                                                                                                                              position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
                                                                                                                                                                                                                                                                                  background: var(--teal); color: white;
                                                                                                                                                                                                                                                                                      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12px;
                                                                                                                                                                                                                                                                                          padding: 5px 16px; border-radius: 100px; white-space: nowrap;
                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                          .pricing-plan { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 6px; }
                                                                                                                                                                                                                                                                            .pricing-price { font-family: 'Sora', sans-serif; font-size: 36px; font-weight: 700; margin: 16px 0 4px; }
                                                                                                                                                                                                                                                                              .pricing-price span { font-size: 16px; font-weight: 400; color: var(--muted); }
                                                                                                                                                                                                                                                                                .pricing-note { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
                                                                                                                                                                                                                                                                                  .pricing-feature { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; font-size: 14px; }
                                                                                                                                                                                                                                                                                    .pricing-check { width: 18px; height: 18px; border-radius: 50%; background: var(--teal-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
                                                                                                                                                                                                                                                                                      .pricing-check svg { width: 10px; height: 10px; stroke: var(--teal); fill: none; stroke-width: 3; }
                                                                                                                                                                                                                                                                                        .pricing-cta {
                                                                                                                                                                                                                                                                                              display: block; text-align: center; margin-top: 24px;
                                                                                                                                                                                                                                                                                                  padding: 14px; border-radius: 10px;
                                                                                                                                                                                                                                                                                                      font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px;
                                                                                                                                                                                                                                                                                                          text-decoration: none; transition: all 0.2s;
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                          .pricing-cta.primary { background: var(--teal); color: white; }
                                                                                                                                                                                                                                                                                            .pricing-cta.primary:hover { background: var(--teal-dark); }
                                                                                                                                                                                                                                                                                              .pricing-cta.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); }
                                                                                                                                                                                                                                                                                                .pricing-cta.ghost:hover { border-color: var(--teal); color: var(--teal); }
                                                                                                                                                                                                                                                                                                  .offer-banner {
                                                                                                                                                                                                                                                                                                        background: linear-gradient(90deg, #0F6E56, #1D9E75);
                                                                                                                                                                                                                                                                                                            color: white; border-radius: 12px; padding: 20px 28px;
                                                                                                                                                                                                                                                                                                                display: flex; align-items: center; gap: 16px;
                                                                                                                                                                                                                                                                                                                    margin-bottom: 32px;
                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                    .offer-icon { font-size: 28px; flex-shrink: 0; }
                                                                                                                                                                                                                                                                                                      .offer-text { font-size: 15px; }
                                                                                                                                                                                                                                                                                                        .offer-text strong { font-family: 'Sora', sans-serif; font-weight: 700; display: block; font-size: 17px; margin-bottom: 2px; }

                                                                                                                                                                                                                                                                                                          /* TESTIMONIAL */
                                                                                                                                                                                                                                                                                                            .testimonial-section { background: white; }
                                                                                                                                                                                                                                                                                                              .testimonial-card {
                                                                                                                                                                                                                                                                                                                    background: var(--teal-light); border: 1px solid var(--teal-mid);
                                                                                                                                                                                                                                                                                                                        border-radius: 16px; padding: 36px;
                                                                                                                                                                                                                                                                                                                            max-width: 700px;
                                                                                                                                                                                                                                                                                                                                margin-top: 40px;
                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                .testimonial-text { font-size: 18px; font-style: italic; color: var(--ink); margin-bottom: 20px; line-height: 1.7; }
                                                                                                                                                                                                                                                                                                                  .testimonial-author { display: flex; align-items: center; gap: 14px; }
                                                                                                                                                                                                                                                                                                                    .testimonial-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--teal); color: white; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
                                                                                                                                                                                                                                                                                                                      .testimonial-name { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; }
                                                                                                                                                                                                                                                                                                                        .testimonial-role { font-size: 13px; color: var(--muted); }

                                                                                                                                                                                                                                                                                                                          /* TRUST */
                                                                                                                                                                                                                                                                                                                            .trust-section { background: var(--surface); }
                                                                                                                                                                                                                                                                                                                              .trust-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 48px; }
                                                                                                                                                                                                                                                                                                                                .trust-card { background: white; border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
                                                                                                                                                                                                                                                                                                                                  .trust-icon { font-size: 28px; margin-bottom: 12px; }
                                                                                                                                                                                                                                                                                                                                    .trust-title { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 15px; margin-bottom: 6px; }
                                                                                                                                                                                                                                                                                                                                      .trust-desc { font-size: 13px; color: var(--muted); line-height: 1.65; }

                                                                                                                                                                                                                                                                                                                                        /* CTA FINAL */
                                                                                                                                                                                                                                                                                                                                          .cta-final { background: var(--teal); padding: 80px 5%; text-align: center; }
                                                                                                                                                                                                                                                                                                                                            .cta-final h2 { font-size: clamp(28px, 3.5vw, 44px); font-weight: 700; color: white; margin-bottom: 16px; }
                                                                                                                                                                                                                                                                                                                                              .cta-final p { font-size: 18px; color: rgba(255,255,255,0.8); margin-bottom: 36px; }
                                                                                                                                                                                                                                                                                                                                                .cta-final .btn-white {
                                                                                                                                                                                                                                                                                                                                                      background: white; color: var(--teal-dark);
                                                                                                                                                                                                                                                                                                                                                          padding: 18px 40px; border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                              font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px;
                                                                                                                                                                                                                                                                                                                                                                  text-decoration: none; display: inline-block; transition: all 0.2s;
                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                  .cta-final .btn-white:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
